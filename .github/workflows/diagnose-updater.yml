name: Diagnose B33R IPTV updater

on:
  push:
    branches: [main]
    paths:
      - "build-input/updater-diagnostics/TRIGGER.md"
      - ".github/workflows/diagnose-updater.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract updater sources
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/b33r-updater-source"
          OUT="build-input/updater-diagnostics/source"
          rm -rf "$SRC" "$OUT"
          mkdir -p "$SRC" "$OUT"
          unzip -q versions/1.9.12/StreamDeck-IPTV-source-1.9.12.zip -d "$SRC"

          cd "$SRC"
          mapfile -t matches < <(
            grep -RIlE --include='*.kt' --include='*.java' --include='*.xml' --include='*.kts' --include='*.gradle' \
              'latest\.json|apkUrl|sha256|REQUEST_INSTALL_PACKAGES|FileProvider|ACTION_VIEW|checkForUpdate|UpdateManager|UpdateInfo|versionCode' . | sort -u
          )

          {
            echo "# Updater diagnostics"
            echo
            echo "Generated from versions/1.9.12/StreamDeck-IPTV-source-1.9.12.zip."
            echo
            printf '%s\n' "${matches[@]}"
          } > "$GITHUB_WORKSPACE/build-input/updater-diagnostics/FILES.md"

          for file in "${matches[@]}"; do
            clean="${file#./}"
            mkdir -p "$GITHUB_WORKSPACE/$OUT/$(dirname "$clean")"
            cp "$clean" "$GITHUB_WORKSPACE/$OUT/$clean"
          done

      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-input/updater-diagnostics
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Extract 1.9.12 updater diagnostics"
          git push origin HEAD:main
