name: Publish latest B33R GitHub release

on:
  push:
    branches: [main]
    paths:
      - "versions/latest.json"
  pull_request:
    branches: [main]
    paths:
      - "release-triggers/publish-latest-github-release"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-latest-b33r-github-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stable main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read and verify latest stable release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("versions/latest.json"))["versionName"])')"
          SHA="$(python3 -c 'import json; print(json.load(open("versions/latest.json"))["sha256"])')"
          APK="versions/$VERSION/StreamDeck-IPTV-$VERSION.apk"
          SOURCE="versions/$VERSION/StreamDeck-IPTV-source-$VERSION.zip"
          test -s "$APK"
          test -s "$SOURCE"
          echo "$SHA  $APK" | sha256sum -c -
          cp "$APK" "$RUNNER_TEMP/B33R-IPTV.apk"
          cp "$SOURCE" "$RUNNER_TEMP/B33R-IPTV-source.zip"
          python3 - "$VERSION" > "$RUNNER_TEMP/release-notes.md" <<'PY'
          import json, sys
          version = sys.argv[1]
          data = json.load(open("versions/latest.json"))
          print(f"B33R IPTV {version}")
          print()
          for note in data.get("notes", []):
              print(f"- {note}")
          print()
          print(f"APK SHA-256: `{data['sha256']}`")
          PY
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or update latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "B33R IPTV $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
            gh release upload "$TAG" \
              "$RUNNER_TEMP/B33R-IPTV.apk#B33R IPTV latest APK" \
              "$RUNNER_TEMP/B33R-IPTV-source.zip#B33R IPTV source" \
              --clobber
          else
            gh release create "$TAG" \
              "$RUNNER_TEMP/B33R-IPTV.apk#B33R IPTV latest APK" \
              "$RUNNER_TEMP/B33R-IPTV-source.zip#B33R IPTV source" \
              --target main \
              --title "B33R IPTV $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --latest
          fi

      - name: Verify permanent latest URL
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            --output "$RUNNER_TEMP/latest-download.apk" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/B33R-IPTV.apk"
          cmp "$RUNNER_TEMP/B33R-IPTV.apk" "$RUNNER_TEMP/latest-download.apk"
