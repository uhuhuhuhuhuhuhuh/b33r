name: Secure release B33R IPTV 1.9.16

on:
  pull_request:
    branches: [main]
    paths:
      - "build-input/1.9.16/start-secure-release"

permissions:
  contents: write

concurrency:
  group: secure-release-b33r-1.9.16
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build, sign, verify, and publish
        shell: bash
        run: bash build-input/1.9.16/secure-release.sh
