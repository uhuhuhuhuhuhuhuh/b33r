name: Repair B33R IPTV 2.0.0 latest asset

on:
  pull_request:
    branches: [main]
    paths:
      - "release-triggers/fix-b33r-2.0.0-latest-asset"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out stable main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify stable files
        shell: bash
        run: |
          set -euo pipefail
          APK="versions/2.0.0/StreamDeck-IPTV-2.0.0.apk"
          SOURCE="versions/2.0.0/StreamDeck-IPTV-source-2.0.0.zip"
          test -s "$APK"
          test -s "$SOURCE"
          echo "783bc1c6cc406f59927a3faa9f2ae2b3766b6854573885014b2cdd1a353ddad6  $APK" | sha256sum -c -
          echo "3e21a09d3980c167cf6918b15dd4e4ec156610616090af8397a11f1ac823d71e  $SOURCE" | sha256sum -c -
          cp "$APK" "$RUNNER_TEMP/B33R-IPTV.apk"
          cp "$SOURCE" "$RUNNER_TEMP/B33R-IPTV-source.zip"

      - name: Replace permanent release assets
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v2.0.0 \
            "$RUNNER_TEMP/B33R-IPTV.apk" \
            "$RUNNER_TEMP/B33R-IPTV-source.zip" \
            --clobber
          gh release edit v2.0.0 --latest

      - name: Verify permanent Downloader URL
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/uhuhuhuhuhuhuhuh/b33r/releases/latest/download/B33R-IPTV.apk"
          for attempt in $(seq 1 12); do
            if curl -fsSL "$URL" -o "$RUNNER_TEMP/B33R-IPTV-latest.apk"; then
              if echo "783bc1c6cc406f59927a3faa9f2ae2b3766b6854573885014b2cdd1a353ddad6  $RUNNER_TEMP/B33R-IPTV-latest.apk" | sha256sum -c -; then
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1

      - name: Upload stable release artifact
        uses: actions/upload-artifact@v4
        with:
          name: B33R-IPTV-2.0.0-stable
          path: |
            ${{ runner.temp }}/B33R-IPTV.apk
            ${{ runner.temp }}/B33R-IPTV-source.zip
          if-no-files-found: error
          retention-days: 5
