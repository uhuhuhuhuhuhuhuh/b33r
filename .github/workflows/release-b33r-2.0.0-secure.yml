name: Secure release B33R IPTV 2.0.0

on:
  pull_request:
    branches: [main]
    paths:
      - "build-input/2.0.0/start-secure-release"

permissions:
  contents: write

concurrency:
  group: secure-release-b33r-2.0.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build, sign, verify, and publish
        shell: bash
        run: bash build-input/2.0.0/secure-release.sh

      - name: Upload stable release artifact
        uses: actions/upload-artifact@v4
        with:
          name: B33R-IPTV-2.0.0-stable
          path: |
            ${{ runner.temp }}/b33r-2.0.0-release/StreamDeck-IPTV-2.0.0.apk
            ${{ runner.temp }}/b33r-2.0.0-release/StreamDeck-IPTV-source-2.0.0.zip
          if-no-files-found: error
          retention-days: 5
