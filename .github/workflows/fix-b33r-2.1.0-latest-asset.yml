name: Repair B33R IPTV 2.1.0 latest asset

on:
  pull_request:
    branches: [main]
    paths:
      - 'build-input/2.1.0/fix-asset-trigger.txt'

permissions:
  contents: write

concurrency:
  group: b33r-2.1.0-asset-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out stable main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify stable files
        run: |
          set -euo pipefail
          APK='versions/2.1.0/StreamDeck-IPTV-2.1.0.apk'
          SOURCE='versions/2.1.0/StreamDeck-IPTV-source-2.1.0.zip'
          EXPECTED_APK=$(python3 -c "import json; print(json.load(open('versions/2.1.0/release.json'))['sha256'])")
          EXPECTED_SOURCE=$(python3 -c "import json; print(json.load(open('versions/2.1.0/release.json'))['sourceSha256'])")
          ACTUAL_APK=$(sha256sum "$APK" | awk '{print $1}')
          ACTUAL_SOURCE=$(sha256sum "$SOURCE" | awk '{print $1}')
          test "$ACTUAL_APK" = "$EXPECTED_APK"
          test "$ACTUAL_SOURCE" = "$EXPECTED_SOURCE"
          cp "$APK" /tmp/B33R-IPTV.apk
          cp "$SOURCE" /tmp/B33R-IPTV-source.zip
          cat > /tmp/checksums.txt <<EOF
          APK_SHA256=$ACTUAL_APK
          SOURCE_SHA256=$ACTUAL_SOURCE
          SIGNING_CERT_SHA256=9948ad6eade4249478b09ab40b01073ae33182b1b1cd06cd576664a8f5b15839
          VERSION_CODE=34
          EOF

      - name: Replace permanent release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v2.1.0 /tmp/B33R-IPTV.apk /tmp/B33R-IPTV-source.zip --repo uhuhuhuhuhuhuhuh/b33r --clobber

      - name: Verify permanent Downloader URL
        run: |
          set -euo pipefail
          EXPECTED=$(python3 -c "import json; print(json.load(open('versions/2.1.0/release.json'))['sha256'])")
          URL='https://github.com/uhuhuhuhuhuhuhuh/b33r/releases/latest/download/B33R-IPTV.apk'
          VERIFIED=false
          for i in $(seq 1 18); do
            if curl -LfsS "$URL" -o /tmp/B33R-IPTV-permanent.apk; then
              ACTUAL=$(sha256sum /tmp/B33R-IPTV-permanent.apk | awk '{print $1}')
              if test "$ACTUAL" = "$EXPECTED"; then
                VERIFIED=true
                break
              fi
            fi
            sleep 5
          done
          test "$VERIFIED" = true

      - name: Upload stable release artifact
        uses: actions/upload-artifact@v4
        with:
          name: B33R-IPTV-2.1.0-stable
          path: |
            /tmp/B33R-IPTV.apk
            /tmp/B33R-IPTV-source.zip
            /tmp/checksums.txt
          retention-days: 5
