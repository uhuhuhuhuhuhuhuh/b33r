name: Secure release B33R IPTV 2.1.0

on:
  pull_request:
    branches: [main]
    paths:
      - 'build-input/2.1.0/release-trigger.txt'

permissions:
  contents: write

concurrency:
  group: b33r-2.1.0-secure-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build, sign, verify, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_BRANCH: ${{ github.head_ref }}
        run: bash build-input/2.1.0/secure-release.sh

      - name: Upload stable release artifact
        uses: actions/upload-artifact@v4
        with:
          name: B33R-IPTV-2.1.0-stable
          path: /tmp/b33r-2.1.0-export/*
          retention-days: 5
