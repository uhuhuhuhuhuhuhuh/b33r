name: Validate B33R IPTV 1.9.15

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/validate-iptv-1.9.15.yml"
      - "build-input/1.9.15/**"

permissions:
  contents: read

env:
  VERSION_NAME: "1.9.15"
  VERSION_CODE: "30"
  SOURCE_ARCHIVE: "versions/1.9.14/StreamDeck-IPTV-source-1.9.14.zip"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "BUILD_TOOLS=$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_ENV"

      - name: Prepare compact 1.9.15 source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/b33r-iptv-$VERSION_NAME"
          rm -rf "$SRC"
          mkdir -p "$SRC"
          python3 - "$SOURCE_ARCHIVE" "$SRC" <<'PY'
          import pathlib, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename.replace("\\", "/").lstrip("/")
                  if not name:
                      continue
                  destination = target / name
                  if info.is_dir() or name.endswith("/"):
                      destination.mkdir(parents=True, exist_ok=True)
                  else:
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(zf.read(info))
          PY
          cat build-input/1.9.15/patch-*.diff > "$RUNNER_TEMP/b33r-1.9.15.patch"
          patch -d "$SRC" -p1 --forward --batch < "$RUNNER_TEMP/b33r-1.9.15.patch"
          python3 -m pip install --quiet pillow
          python3 - "$SRC" build-input/1.9.15/icon-01.b64 <<'PY'
          import base64, io, pathlib, sys
          from PIL import Image, ImageDraw, ImageFont

          root = pathlib.Path(sys.argv[1])
          source = Image.open(io.BytesIO(base64.b64decode(pathlib.Path(sys.argv[2]).read_text()))).convert("RGBA")
          side = min(source.size)
          source = source.crop(((source.width-side)//2, (source.height-side)//2, (source.width+side)//2, (source.height+side)//2))
          res = root / "app/src/main/res"

          def inset(size, ratio):
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              inner = int(size * (1 - 2 * ratio))
              art = source.resize((inner, inner), Image.Resampling.LANCZOS)
              offset = (size - inner) // 2
              canvas.alpha_composite(art, (offset, offset))
              return canvas

          for density, size in {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              inset(size, .035).save(folder / "ic_launcher.png", optimize=True)
              round_icon = inset(size, .06)
              mask = Image.new("L", (size, size), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, size-1, size-1), fill=255)
              round_icon.putalpha(Image.composite(round_icon.getchannel("A"), Image.new("L", (size, size), 0), mask))
              round_icon.save(folder / "ic_launcher_round.png", optimize=True)

          nodpi = res / "drawable-nodpi"
          nodpi.mkdir(parents=True, exist_ok=True)
          inset(320, .02).save(nodpi / "b33r_login_logo.png", optimize=True)
          adaptive = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          art = source.resize((318, 318), Image.Resampling.LANCZOS)
          adaptive.alpha_composite(art, ((432-318)//2, (432-318)//2))
          adaptive.save(nodpi / "ic_launcher_foreground_art.png", optimize=True)

          def font(size, bold=False):
              path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf" if bold else "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
              return ImageFont.truetype(path, size)

          banner = Image.new("RGB", (320, 180), "#070707")
          draw = ImageDraw.Draw(banner)
          for y in range(180):
              v = int(7 + 14 * (1 - y / 179))
              draw.line((0, y, 319, y), fill=(v, v, v))
          banner.paste(source.resize((146, 146), Image.Resampling.LANCZOS).convert("RGB"), (9, 17))
          draw.text((164, 53), "B33R", font=font(37, True), fill="#FFB31A", stroke_width=1, stroke_fill="#6B3C00")
          draw.text((166, 98), "IPTV", font=font(24, True), fill="#F6F6F6")
          draw.rounded_rectangle((164, 132, 300, 139), radius=3, fill="#FFB31A")
          for path in [res / "drawable/tv_banner.png", *sorted(res.glob("drawable-*/tv_banner.png"))]:
              banner.save(path, optimize=True)
          PY
          chmod +x "$SRC/gradlew"
          echo "src=$SRC" >> "$GITHUB_OUTPUT"

      - name: Create disposable validation key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/validation.keystore"
          keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass validation -keypass validation -alias validation -keyalg RSA -keysize 2048 -validity 365 -dname "CN=B33R Validation"
          echo "B33R_RELEASE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
          echo "B33R_RELEASE_STORE_PASSWORD=validation" >> "$GITHUB_ENV"
          echo "B33R_RELEASE_KEY_ALIAS=validation" >> "$GITHUB_ENV"
          echo "B33R_RELEASE_KEY_PASSWORD=validation" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: ${{ steps.source.outputs.src }}
        shell: bash
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify build metadata
        shell: bash
        env:
          SRC: ${{ steps.source.outputs.src }}
        run: |
          set -euo pipefail
          APK="$SRC/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.streamdeck.iptv' versionCode='30' versionName='1.9.15'" "$RUNNER_TEMP/badging.txt"

      - name: Package validation artifact
        id: package
        shell: bash
        env:
          SRC: ${{ steps.source.outputs.src }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/b33r-1.9.15-validation"
          mkdir -p "$OUT"
          cp "$SRC/app/build/outputs/apk/release/app-release.apk" "$OUT/StreamDeck-IPTV-1.9.15-validation.apk"
          python3 - "$SRC" "$OUT/StreamDeck-IPTV-source-1.9.15.zip" <<'PY'
          import pathlib, sys, zipfile
          source = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(source.rglob("*")):
                  relative = path.relative_to(source)
                  if any(part in {".gradle", "build"} for part in relative.parts):
                      continue
                  if path.name in {"local.properties", "validation.keystore"} or not path.is_file():
                      continue
                  zf.write(path, relative.as_posix())
          PY
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: b33r-1.9.15-validation
          path: ${{ steps.package.outputs.out }}/*
          if-no-files-found: error
          retention-days: 7
