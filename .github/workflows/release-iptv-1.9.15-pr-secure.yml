name: Secure PR release B33R IPTV 1.9.15

on:
  pull_request:
    branches: [main]
    paths:
      - "build-input/1.9.15/start-pr-secure-release"

permissions:
  contents: write

concurrency:
  group: secure-pr-release-b33r-1.9.15
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out validated 1.9.15 branch
        uses: actions/checkout@v4
        with:
          ref: agent/b33r-1.9.15-login-icon
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run encrypted stable release
        shell: bash
        run: bash build-input/1.9.15/secure_release_pr.sh
