name: Validate B33R IPTV 1.9.12 updater hotfix

on:
  push:
    branches: [main]
    paths:
      - "build-input/1.9.12/VALIDATE_TRIGGER.md"
      - ".github/workflows/validate-iptv-1.9.12-hotfix.yml"
      - "build-input/1.9.12/apply_updater_hotfix.py"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate patch and compile
        id: validation
        shell: bash
        run: |
          set +e
          LOG="$GITHUB_WORKSPACE/build-input/1.9.12/VALIDATION.log"
          STATUS="$GITHUB_WORKSPACE/build-input/1.9.12/VALIDATION_STATUS.md"
          SRC="$RUNNER_TEMP/b33r-iptv-1.9.12-validation"
          rm -rf "$SRC"
          mkdir -p "$SRC"

          {
            set -x
            unzip -q "$GITHUB_WORKSPACE/versions/1.9.11/StreamDeck-IPTV-source-1.9.11.zip" -d "$SRC"
            base64 --decode "$GITHUB_WORKSPACE/build-input/1.9.12/AppUi-01-responsive.patch.gz.b64" \
              | gzip -dc > "$RUNNER_TEMP/AppUi-01-responsive.patch"
            cd "$SRC"
            patch -p1 --forward --batch < "$RUNNER_TEMP/AppUi-01-responsive.patch"
            python3 "$GITHUB_WORKSPACE/build-input/1.9.12/apply_updater_hotfix.py"
            python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("app/build.gradle.kts")
          text = path.read_text()
          text, count_code = re.subn(r'versionCode\s*=\s*25', 'versionCode = 27', text, count=1)
          text, count_name = re.subn(r'versionName\s*=\s*"1\.9\.11"', 'versionName = "1.9.12"', text, count=1)
          text = re.sub(
              r'compileSdk\s*\{\s*version\s*=\s*release\(36\)\s*\{\s*minorApiLevel\s*=\s*1\s*\}\s*\}',
              'compileSdk = 36',
              text,
              count=1,
              flags=re.S,
          )
          if count_code != 1 or count_name != 1:
              raise SystemExit("Could not update version metadata")
          path.write_text(text)
          PY
            chmod +x gradlew
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
            ./gradlew --no-daemon --stacktrace assembleDebug
          } > "$LOG" 2>&1
          result=$?

          if [[ $result -eq 0 ]]; then
            cat > "$STATUS" <<'EOF'
          # 1.9.12 updater hotfix validation

          Status: **passed**

          The responsive UI and updater-feedback hotfix compiled successfully as an Android debug APK.
          EOF
          else
            cat > "$STATUS" <<EOF
          # 1.9.12 updater hotfix validation

          Status: **failed**

          Exit code: $result

          See \`build-input/1.9.12/VALIDATION.log\` for the exact patch or compiler error.
          EOF
          fi
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit validation result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-input/1.9.12/VALIDATION.log build-input/1.9.12/VALIDATION_STATUS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record 1.9.12 updater hotfix validation"
          git push origin HEAD:main

      - name: Fail workflow after recording diagnostics
        if: steps.validation.outputs.result != '0'
        shell: bash
        run: exit 1
