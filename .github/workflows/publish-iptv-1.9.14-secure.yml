name: Securely publish B33R IPTV 1.9.14

on:
  push:
    branches:
      - "agent/build-b33r-1.9.14"
    paths:
      - "build-input/1.9.14/start-signing"

permissions:
  contents: write

env:
  VERSION_NAME: "1.9.14"
  VERSION_CODE: "29"
  SOURCE_ARCHIVE: "versions/1.9.13/StreamDeck-IPTV-source-1.9.13.zip"
  BUILD_BRANCH: "agent/build-b33r-1.9.14"
  PAYLOAD_PATH: "build-input/1.9.14/signing-payload.json"
  PUBLIC_KEY_PATH: "build-input/1.9.14/ephemeral-public.pem"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out secure build branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_BRANCH }}
          fetch-depth: 0

      - name: Generate ephemeral encryption key
        shell: bash
        run: |
          set -euo pipefail
          PRIVATE_KEY="$RUNNER_TEMP/b33r-signing-private.pem"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$PRIVATE_KEY" 2>/dev/null
          openssl pkey -in "$PRIVATE_KEY" -pubout -out "$PUBLIC_KEY_PATH" 2>/dev/null
          chmod 600 "$PRIVATE_KEY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PUBLIC_KEY_PATH"
          git commit -m "Publish ephemeral 1.9.14 signing key"
          git push origin "HEAD:$BUILD_BRANCH"
          echo "PRIVATE_KEY=$PRIVATE_KEY" >> "$GITHUB_ENV"

      - name: Wait for encrypted signing payload
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="$RUNNER_TEMP/b33r-signing-payload.json"
          found=false
          for attempt in $(seq 1 180); do
            git fetch --quiet origin "$BUILD_BRANCH"
            if git show "origin/$BUILD_BRANCH:$PAYLOAD_PATH" > "$PAYLOAD" 2>/dev/null; then
              found=true
              break
            fi
            sleep 5
          done
          if [[ "$found" != "true" ]]; then
            echo "Encrypted signing payload was not supplied." >&2
            exit 1
          fi
          chmod 600 "$PAYLOAD"
          echo "PAYLOAD_FILE=$PAYLOAD" >> "$GITHUB_ENV"

      - name: Install payload decryption dependency
        shell: bash
        run: python3 -m pip install --quiet cryptography

      - name: Decrypt signing material in runner memory
        shell: bash
        run: |
          set -euo pipefail
          SECRET_DIR="$RUNNER_TEMP/b33r-signing"
          mkdir -p "$SECRET_DIR"
          chmod 700 "$SECRET_DIR"
          python3 - "$PRIVATE_KEY" "$PAYLOAD_FILE" "$SECRET_DIR" <<'PY'
          import base64
          import json
          import pathlib
          import sys
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          private_path = pathlib.Path(sys.argv[1])
          payload_path = pathlib.Path(sys.argv[2])
          output = pathlib.Path(sys.argv[3])
          payload = json.loads(payload_path.read_text())
          private_key = serialization.load_pem_private_key(private_path.read_bytes(), password=None)
          aes_key = private_key.decrypt(
              base64.b64decode(payload["wrappedKey"]),
              padding.OAEP(
                  mgf=padding.MGF1(algorithm=hashes.SHA256()),
                  algorithm=hashes.SHA256(),
                  label=None,
              ),
          )
          plaintext = AESGCM(aes_key).decrypt(
              base64.b64decode(payload["nonce"]),
              base64.b64decode(payload["ciphertext"]),
              b"b33r-iptv-1.9.14",
          )
          secret = json.loads(plaintext)
          (output / "release.keystore").write_bytes(base64.b64decode(secret["keystoreBase64"]))
          (output / "credentials.json").write_text(json.dumps({
              "storePassword": secret["storePassword"],
              "keyAlias": secret["keyAlias"],
              "keyPassword": secret["keyPassword"],
          }))
          (output / "release.keystore").chmod(0o600)
          (output / "credentials.json").chmod(0o600)
          PY
          echo "SECRET_DIR=$SECRET_DIR" >> "$GITHUB_ENV"
          rm -f "$PRIVATE_KEY" "$PAYLOAD_FILE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "BUILD_TOOLS=$SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_ENV"

      - name: Prepare 1.9.14 source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/b33r-iptv-${VERSION_NAME}"
          rm -rf "$SRC"
          mkdir -p "$SRC"
          python3 - "$SOURCE_ARCHIVE" "$SRC" <<'PY'
          import pathlib, sys, zipfile
          archive = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  normalized = info.filename.replace("\\", "/").lstrip("/")
                  if not normalized:
                      continue
                  destination = target / normalized
                  if info.is_dir() or normalized.endswith("/"):
                      destination.mkdir(parents=True, exist_ok=True)
                  else:
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(zf.read(info))
          PY
          cd "$SRC"
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("app/build.gradle.kts")
          text = path.read_text()
          text, code_count = re.subn(r'versionCode\s*=\s*28', 'versionCode = 29', text, count=1)
          text, name_count = re.subn(r'versionName\s*=\s*"1\.9\.13"', 'versionName = "1.9.14"', text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not update version metadata")
          path.write_text(text)
          PY
          chmod +x gradlew
          echo "src=$SRC" >> "$GITHUB_OUTPUT"

      - name: Build with original B33R signing identity
        working-directory: ${{ steps.source.outputs.src }}
        shell: bash
        run: |
          set -euo pipefail
          read_secret() {
            python3 - "$SECRET_DIR/credentials.json" "$1" <<'PY'
          import json, pathlib, sys
          print(json.loads(pathlib.Path(sys.argv[1]).read_text())[sys.argv[2]])
          PY
          }
          STORE_PASSWORD="$(read_secret storePassword)"
          KEY_ALIAS="$(read_secret keyAlias)"
          KEY_PASSWORD="$(read_secret keyPassword)"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          echo "::add-mask::$KEY_PASSWORD"
          export B33R_RELEASE_STORE_FILE="$SECRET_DIR/release.keystore"
          export B33R_RELEASE_STORE_PASSWORD="$STORE_PASSWORD"
          export B33R_RELEASE_KEY_ALIAS="$KEY_ALIAS"
          export B33R_RELEASE_KEY_PASSWORD="$KEY_PASSWORD"
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify signing identity and package release
        id: package
        shell: bash
        env:
          SRC: ${{ steps.source.outputs.src }}
        run: |
          set -euo pipefail
          APK="$SRC/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/verify-1.9.14.txt"
          NEW_CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')"
          STABLE_CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs versions/1.9.10/StreamDeck-IPTV-1.9.10.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}')"
          test -n "$NEW_CERT"
          test "$NEW_CERT" = "$STABLE_CERT"

          OUT="$RUNNER_TEMP/b33r-1.9.14-release"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp "$APK" "$OUT/StreamDeck-IPTV-$VERSION_NAME.apk"
          python3 - "$SRC" "$OUT/StreamDeck-IPTV-source-$VERSION_NAME.zip" <<'PY'
          import pathlib, sys, zipfile
          source = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          excluded_parts = {".gradle", "build"}
          excluded_names = {"local.properties", "release.keystore", "credentials.json"}
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in sorted(source.rglob("*")):
                  relative = path.relative_to(source)
                  if any(part in excluded_parts for part in relative.parts):
                      continue
                  if path.name in excluded_names or not path.is_file():
                      continue
                  zf.write(path, relative.as_posix())
          PY
          SIZE="$(stat -c '%s' "$OUT/StreamDeck-IPTV-$VERSION_NAME.apk")"
          SHA="$(sha256sum "$OUT/StreamDeck-IPTV-$VERSION_NAME.apk" | awk '{print $1}')"
          SOURCE_SHA="$(sha256sum "$OUT/StreamDeck-IPTV-source-$VERSION_NAME.zip" | awk '{print $1}')"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "cert=$NEW_CERT" >> "$GITHUB_OUTPUT"

      - name: Publish 1.9.14 to main
        shell: bash
        env:
          OUT: ${{ steps.package.outputs.out }}
          SIZE: ${{ steps.package.outputs.size }}
          SHA: ${{ steps.package.outputs.sha }}
          SOURCE_SHA: ${{ steps.package.outputs.source_sha }}
          CERT: ${{ steps.package.outputs.cert }}
        run: |
          set -euo pipefail
          git fetch origin main
          PUBLISH="$RUNNER_TEMP/b33r-publish-main"
          rm -rf "$PUBLISH"
          git worktree add --detach "$PUBLISH" origin/main
          DEST="$PUBLISH/versions/$VERSION_NAME"
          mkdir -p "$DEST"
          cp "$OUT/StreamDeck-IPTV-$VERSION_NAME.apk" "$DEST/"
          cp "$OUT/StreamDeck-IPTV-source-$VERSION_NAME.zip" "$DEST/"

          python3 - "$PUBLISH" <<'PY'
          from datetime import date
          from pathlib import Path
          import json
          import os
          import sys

          root = Path(sys.argv[1])
          version = os.environ["VERSION_NAME"]
          code = int(os.environ["VERSION_CODE"])
          size = int(os.environ["SIZE"])
          sha = os.environ["SHA"]
          source_sha = os.environ["SOURCE_SHA"]
          cert = os.environ["CERT"]
          release_date = date.today().isoformat()
          base = f"https://github.com/uhuhuhuhuhuhuhuh/b33r/raw/main/versions/{version}"
          notes = [
              "Retains the dark, poster-first B33R media-hub interface introduced in 1.9.13.",
              "Uses compact navigation, white television focus frames, and restrained amber selected states.",
              "Preserves responsive phone, tablet, Android TV, and Fire TV layouts.",
              "Preserves favorites, Continue Watching, secure updates, VLC, Media3, quality, audio, subtitles, and playback fallbacks.",
              "Restores a stable signing identity for normal in-place updates from compatible B33R releases.",
          ]
          latest = {
              "schemaVersion": 1,
              "versionCode": code,
              "versionName": version,
              "releaseDate": release_date,
              "minimumAndroid": "5.0",
              "sizeBytes": size,
              "sha256": sha,
              "apkUrl": f"{base}/StreamDeck-IPTV-{version}.apk",
              "notes": notes,
          }
          (root / "versions/latest.json").write_text(json.dumps(latest, indent=2) + "\n")
          history_path = root / "versions/history.json"
          history = json.loads(history_path.read_text())
          history["latest"] = version
          history["releases"] = [r for r in history.get("releases", []) if r.get("versionName") != version]
          history["releases"].insert(0, {k: latest[k] for k in ("versionCode", "versionName", "releaseDate", "sizeBytes", "apkUrl", "notes")})
          history_path.write_text(json.dumps(history, indent=2) + "\n")
          release = dict(latest)
          release["sourceUrl"] = f"{base}/StreamDeck-IPTV-source-{version}.zip"
          release["sourceSha256"] = source_sha
          release["signingCertificateSha256"] = cert
          (root / f"versions/{version}/release.json").write_text(json.dumps(release, indent=2) + "\n")
          readme = f"""# B33R IPTV {version}

Signed stable Android release retaining the 1.9.13 media-hub UI and playback behavior.

- Package: `com.streamdeck.iptv`
- Version name: `{version}`
- Version code: `{code}`
- Minimum Android: 5.0
- APK SHA-256: `{sha}`
- Source SHA-256: `{source_sha}`
- Signing certificate SHA-256: `{cert}`
- APK size: {size} bytes

The signing certificate matches B33R IPTV 1.9.10, permitting normal Android in-place updates from releases signed with that identity.
"""
          (root / f"versions/{version}/README.md").write_text(readme)
          PY

          cd "$PUBLISH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "versions/$VERSION_NAME" versions/latest.json versions/history.json
          git commit -m "Release B33R IPTV $VERSION_NAME"
          git push origin HEAD:main

      - name: Remove decrypted signing material
        if: always()
        shell: bash
        run: rm -rf "${SECRET_DIR:-}" "${PRIVATE_KEY:-}" "${PAYLOAD_FILE:-}"
