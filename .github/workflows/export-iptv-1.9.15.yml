name: Export B33R IPTV 1.9.15

on:
  pull_request:
    branches: [main]
    paths:
      - "build-input/export-1.9.15"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out stable main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          test -s versions/1.9.15/StreamDeck-IPTV-1.9.15.apk
          test -s versions/1.9.15/StreamDeck-IPTV-source-1.9.15.zip
          echo "a972eb3627d48a727c1dc62fcd8b6827e5f77c46d2a6a9a657d7b1acbfdbf1bf  versions/1.9.15/StreamDeck-IPTV-1.9.15.apk" | sha256sum -c -
          echo "36e2572481a1c48ba3437e3422b1a5cbf995924c2123aa222eccae2200cc6fe1  versions/1.9.15/StreamDeck-IPTV-source-1.9.15.zip" | sha256sum -c -

      - name: Upload stable release
        uses: actions/upload-artifact@v4
        with:
          name: B33R-IPTV-1.9.15-stable
          path: |
            versions/1.9.15/StreamDeck-IPTV-1.9.15.apk
            versions/1.9.15/StreamDeck-IPTV-source-1.9.15.zip
            versions/1.9.15/release.json
            versions/1.9.15/README.md
          if-no-files-found: error
          retention-days: 2
